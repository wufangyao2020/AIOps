name: Build A-share 2026 H1 archive

on:
  issues:
    types: [opened]
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * 1"

permissions:
  contents: write

concurrency:
  group: a-share-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.event_name != 'issues' || github.event.issue.title == '[archive] run 2026H1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile archive scripts
        run: python -m py_compile scripts/*.py

      - name: Fetch and normalize the A-share universe
        run: python scripts/fetch_archive.py

      - name: Profile source dimensions
        run: python scripts/diagnose_universe.py

      - name: Validate generated archive
        run: python scripts/validate_archive.py

      - name: Commit generated snapshot
        run: |
          git config user.name "a-share-archive-bot"
          git config user.email "a-share-archive-bot@users.noreply.github.com"
          git add data meta status
          if git diff --cached --quiet; then
            echo "No archive changes to commit."
          else
            git commit -m "data: refresh 2026 H1 A-share universe"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
