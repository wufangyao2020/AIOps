name: Run A-share 2026 H1 final audited research v6

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: a-share-2026-h1-final-audited-v6
  cancel-in-progress: false

jobs:
  research:
    if: github.event_name != 'issues' || github.event.issue.title == '[research-v6] run 2026H1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      GLOBAL_NOTICE_WORKERS: '3'
      REVIEW_WORKERS: '6'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests pypdf
      - name: Compile final pipeline
        run: |
          python -m py_compile scripts/run_research_pipeline.py
          python -m py_compile scripts/run_research_pipeline_v2.py
          python -m py_compile scripts/run_research_pipeline_v3.py
          python -m py_compile scripts/run_research_pipeline_v4.py
          python -m py_compile scripts/run_research_pipeline_v5.py
      - name: Run pure-A-share evidence-gated research
        run: python scripts/run_research_pipeline_v5.py
      - name: Validate every required layer
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          out = Path('results/2026H1')
          cache = Path('data/research/2026H1')
          required = [
              'universe_four_model_scores.csv',
              'top100_blind_preliminary.csv',
              'top100_announcement_reviews.csv',
              'top100_peer_comparison.csv',
              'final20_high_convexity.csv',
              'final20_high_convexity.jsonl',
              'final20_high_convexity.md',
              'audit_manifest.json',
          ]
          for name in required:
              assert (out/name).exists(), f'missing {name}'
          assert (cache/'announcements_global_relevant_2025-09_to_2026-09.jsonl').exists()
          assert (cache/'announcements_global_scan_meta.json').exists()

          u = pd.read_csv(out/'universe_four_model_scores.csv', dtype={'security_code':str}, low_memory=False)
          b = pd.read_csv(out/'top100_blind_preliminary.csv', low_memory=False)
          t = pd.read_csv(out/'top100_announcement_reviews.csv', dtype={'code':str}, low_memory=False)
          peers = pd.read_csv(out/'top100_peer_comparison.csv', dtype={'code':str}, low_memory=False)
          f = pd.read_csv(out/'final20_high_convexity.csv', dtype={'security_code':str}, low_memory=False)
          manifest = json.loads((out/'audit_manifest.json').read_text('utf-8'))
          global_meta = json.loads((cache/'announcements_global_scan_meta.json').read_text('utf-8'))

          assert len(u) == 5550
          assert u['security_code'].astype(str).str.zfill(6).nunique() == 5550
          assert len(b) == 100
          assert len(t) == 100 and t['code'].astype(str).str.zfill(6).nunique() == 100
          assert len(peers) == 100 and peers['code'].astype(str).str.zfill(6).nunique() == 100
          assert len(f) == 20 and f['security_code'].astype(str).str.zfill(6).nunique() == 20
          assert manifest['universe_count'] == 5550
          assert manifest['top100_count'] == 100
          assert manifest['final20_count'] == 20
          assert int(manifest.get('announcement_company_success_count',0)) >= 5000
          assert int(manifest.get('top100_fulltext_success_count',0)) >= 80
          assert int(global_meta.get('company_announcement_coverage',0)) >= 5000
          assert int(global_meta.get('company_h1_full_report_coverage',0)) >= 5000
          assert int(global_meta.get('segment_error_count',0)) <= 3

          for col in ['fundamental_acceleration_score','new_profit_pool_score','cycle_inflection_score','capital_event_score']:
              values = pd.to_numeric(u[col], errors='coerce')
              assert values.notna().mean() > 0.99, (col, values.notna().mean())
              assert values.between(0,100).mean() > 0.999, col

          chars = pd.to_numeric(f['fulltext_chars_read'], errors='coerce').fillna(0)
          docs = pd.to_numeric(f['documents_read_count'], errors='coerce').fillna(0)
          assert (chars > 1000).all()
          assert (docs >= 1).all()
          assert not f['name'].astype(str).str.contains(r'\*?ST|退', case=False, regex=True).any()
          assert pd.to_numeric(f['double_required_profit_growth_pct'], errors='coerce').notna().sum() >= 16
          print({
              'universe':len(u), 'blind_top100':len(b), 'reviewed_top100':len(t),
              'peer_rows':len(peers), 'final20':len(f),
              'announcement_coverage':manifest.get('announcement_company_success_count'),
              'h1_report_coverage':global_meta.get('company_h1_full_report_coverage'),
              'top100_fulltext':manifest.get('top100_fulltext_success_count'),
              'final20_all_fulltext':bool((chars>1000).all()),
          })
          PY
      - name: Commit final audited results
        run: |
          git config user.name 'a-share-research-bot'
          git config user.email 'a-share-research-bot@users.noreply.github.com'
          git add results/2026H1 data/research/2026H1 status/research_status_2026_h1.csv meta
          if git diff --cached --quiet; then
            echo 'No research changes to commit.'
          else
            git commit -m 'research: complete final pure-A-share 5550-company scan v6'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              sleep $((attempt * 3))
            done
          fi
      - name: Close issue
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'V6最终审计版已通过全部硬校验并写回仓库。'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed',state_reason:'completed'});
      - name: Comment failure
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`V6最终审计版未通过硬校验，run id: ${context.runId}；失败结果不会作为正式候选。`});
