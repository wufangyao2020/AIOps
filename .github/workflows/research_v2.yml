name: Run A-share 2026 H1 full research v2

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: a-share-2026-h1-full-research-v2
  cancel-in-progress: false

jobs:
  research:
    if: github.event_name != 'issues' || github.event.issue.title == '[research-v2] run 2026H1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      ANNOUNCEMENT_WORKERS: '32'
      REVIEW_WORKERS: '8'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests pypdf
      - name: Compile pipeline
        run: |
          python -m py_compile scripts/run_research_pipeline.py
          python -m py_compile scripts/run_research_pipeline_v2.py
      - name: Run full research
        run: python scripts/run_research_pipeline_v2.py
      - name: Validate outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          out=Path('results/2026H1')
          u=pd.read_csv(out/'universe_four_model_scores.csv',low_memory=False)
          t=pd.read_csv(out/'top100_announcement_reviews.csv',low_memory=False)
          f=pd.read_csv(out/'final20_high_convexity.csv',low_memory=False)
          m=json.loads((out/'audit_manifest.json').read_text('utf-8'))
          assert len(u)==5550, len(u)
          assert len(t)==100, len(t)
          assert len(f)==20, len(f)
          assert m['universe_count']==5550
          assert m['final20_count']==20
          print({'universe':len(u),'top100':len(t),'final20':len(f),'fulltext':m['top100_fulltext_success_count'],'announcement_success':m['announcement_company_success_count']})
          PY
      - name: Commit results
        run: |
          git config user.name 'a-share-research-bot'
          git config user.email 'a-share-research-bot@users.noreply.github.com'
          git add results/2026H1 data/research/2026H1 status/research_status_2026_h1.csv meta
          if git diff --cached --quiet; then
            echo 'No research changes to commit.'
          else
            git commit -m 'research: complete 5550-company four-model scan v2'
            git pull --rebase origin main
            git push
          fi
      - name: Close issue
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed',state_reason:'completed'});
      - name: Comment failure
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`v2研究工作流失败，run id: ${context.runId}。请查看Actions日志。`});
