name: Diagnose A-share research endpoints

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  diagnose:
    if: github.event_name != 'issues' || github.event.issue.title == '[research] diagnose endpoints'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python scripts/diagnose_research_endpoints.py
      - run: |
          git config user.name "a-share-research-bot"
          git config user.email "a-share-research-bot@users.noreply.github.com"
          git add meta/research_endpoint_diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh research endpoint diagnostics"
            git pull --rebase origin main || true
            git push || true
          fi
      - if: github.event_name == 'issues' && always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});
