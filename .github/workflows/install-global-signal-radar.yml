name: A-share global industry signal radar

on:
  workflow_dispatch:
  schedule:
    # Beijing 22:15, Monday-Friday: Baltic/Europe/Asia evening preview
    - cron: '15 14 * * 1-5'
    # Beijing 06:35, Monday-Saturday: US close and A-share premarket brief
    - cron: '35 22 * * 0-5'
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: a-share-global-industry-signal-radar
  cancel-in-progress: true

jobs:
  radar:
    if: github.event_name != 'issues' || github.event.issue.title == '[global-signal-radar] run'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      TZ: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas requests beautifulsoup4 lxml html5lib

      - name: Validate signal catalog and mapping
        run: |
          python -m py_compile scripts/global_signal_radar.py scripts/global_signal_radar_v2.py scripts/validate_global_signal_radar.py
          python scripts/validate_global_signal_radar.py

      - name: Run overseas industry signal radar
        run: python scripts/global_signal_radar_v2.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          data=Path('data/global_signals')
          reports=Path('reports/global_signals')
          for path in [data/'numeric_history.csv',data/'event_history.jsonl',data/'latest.json',data/'latest_alert.json',reports/'latest.md']:
              assert path.exists(), f'missing {path}'
          latest=json.loads((data/'latest.json').read_text('utf-8'))
          alert=json.loads((data/'latest_alert.json').read_text('utf-8'))
          history=pd.read_csv(data/'numeric_history.csv',low_memory=False)
          assert latest['data_health']['configured']==37
          assert latest['data_health']['successful']>=24, latest['data_health']
          assert latest['data_health']['failed']<=13, latest['data_health']
          assert history['signal_id'].nunique()>=15, history['signal_id'].nunique()
          assert 'bdi' in latest['signal_results'], 'BDI is a mandatory core signal'
          assert alert['max_level'] in {'NONE','P3','P2','P1'}
          assert len(alert['fingerprint'])>=12
          print({'configured':37,'successful':latest['data_health']['successful'],'failed':latest['data_health']['failed'],'numeric_series':history['signal_id'].nunique(),'bdi_ok':True,'max_level':alert['max_level']})
          PY

      - name: Commit signal history and reports
        run: |
          git config user.name 'global-signal-radar-bot'
          git config user.email 'global-signal-radar-bot@users.noreply.github.com'
          git add data/global_signals reports/global_signals
          if git diff --cached --quiet; then
            echo 'No signal changes to commit.'
          else
            git commit -m "radar: refresh overseas industry signals $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed=0
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              sleep $((attempt * 3))
            done
            test "$pushed" -eq 1
          fi

      - name: Publish P1/P2 issue when needed
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const alert=JSON.parse(fs.readFileSync('data/global_signals/latest_alert.json','utf8'));
            if (!alert.issue_required) { core.info('No P1/P2 alert required.'); return; }
            const marker=`global-signal-fingerprint:${alert.fingerprint}`;
            const q=`repo:${context.repo.owner}/${context.repo.repo} is:issue \"${marker}\" in:body`;
            const found=await github.rest.search.issuesAndPullRequests({q,per_page:5});
            if (found.data.total_count===0) {
              await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:alert.title,body:alert.body});
            }

      - name: Close manual trigger issue
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:'海外产业信号雷达已运行，最新报告见 `reports/global_signals/latest.md`。'});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed',state_reason:'completed'});

      - name: Report manual run failure
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`海外产业信号雷达未通过联网实测或硬校验，run id: ${context.runId}；失败结果不会被作为有效预警。`});
