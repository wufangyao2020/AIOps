name: Run A-share 2026H1 research stage 1 final

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: a-share-research-stage1-final
  cancel-in-progress: true

jobs:
  stage1-final:
    if: github.event_name != 'issues' || github.event.issue.title == '[research] run stage1-final'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests tabulate

      - name: Compile production research scripts
        run: python -m py_compile scripts/research_stage1.py scripts/research_stage1_v2.py scripts/research_stage1_v3.py scripts/research_stage1_v4.py scripts/research_stage1_v5.py scripts/research_stage1_v6.py scripts/validate_research_outputs.py

      - name: Run final full-universe scorer
        id: scoring
        continue-on-error: true
        run: python scripts/research_stage1_v6.py

      - name: Persist input cache
        if: always()
        run: |
          git config user.name "a-share-research-bot"
          git config user.email "a-share-research-bot@users.noreply.github.com"
          git add data/2026H1/research/raw || true
          if ! git diff --cached --quiet; then
            git commit -m "data: cache final stage-one public inputs"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Stop when scoring failed
        if: steps.scoring.outcome != 'success'
        run: exit 1

      - name: Validate stage one
        run: python scripts/validate_research_outputs.py --stage 1

      - name: Commit final stage-one outputs
        run: |
          git config user.name "a-share-research-bot"
          git config user.email "a-share-research-bot@users.noreply.github.com"
          git add data/2026H1/research meta/research_stage1_summary.json meta/research_validation_stage_1.json
          if ! git diff --cached --quiet; then
            git commit -m "research: finalize 2026H1 full-universe stage-one scoring"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              sleep $((attempt * 3))
            done
          fi

      - name: Close trigger issue
        if: github.event_name == 'issues' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ job.status }}';
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: `Final Stage 1 finished with status: **${conclusion}**.`});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, state: 'closed', state_reason: 'completed'});
